<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikipedia Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --bg2: #141720;
    --surface: #1a1e2a;
    --border: rgba(255,255,255,0.08);
    --text: #e2e4ec;
    --muted: #7a7f96;
    --accent: #6c8fff;
    --accent2: #a78bfa;
    --hot: #f59e0b;
    --seed-color: #6c8fff;
    --expanded-color: #a78bfa;
    --leaf-color: #334266;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  #toolbar h1 {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  #seed-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 10px;
    width: 200px;
    outline: none;
    transition: border-color 0.2s;
  }
  #seed-input:focus { border-color: var(--accent); }

  button {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #0d0f14;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 6px 14px;
    text-transform: uppercase;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  button:hover { opacity: 0.85; }
  button:active { transform: scale(0.97); }
  button.secondary {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  #depth-label {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  #depth-slider {
    accent-color: var(--accent);
    cursor: pointer;
    width: 80px;
  }

  #stats {
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
    white-space: nowrap;
  }

  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  svg#graph {
    width: 100%;
    height: 100%;
  }

  .link {
    stroke: rgba(255,255,255,0.07);
    stroke-width: 1;
    fill: none;
    transition: stroke 0.2s;
  }
  .link.highlight { stroke: var(--hot); stroke-width: 2; opacity: 1; }

  .node-circle {
    cursor: pointer;
    transition: r 0.2s, filter 0.2s;
  }
  .node-circle:hover { filter: brightness(1.4); }

  .node-label {
    fill: var(--text);
    font-size: 11px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: central;
  }

  .node-label.seed-label {
    font-size: 13px;
    font-weight: 700;
    fill: var(--accent);
  }

  .glow-ring {
    fill: none;
    pointer-events: none;
  }

  #sidebar {
    width: 280px;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  #sidebar-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  #article-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    padding: 14px 16px 4px;
    line-height: 1.3;
  }

  #article-meta {
    font-size: 11px;
    color: var(--muted);
    padding: 0 16px 10px;
    line-height: 1.5;
  }

  #article-extract {
    font-size: 12px;
    color: #b0b4cc;
    padding: 0 16px;
    line-height: 1.7;
    flex: 1;
    overflow-y: auto;
    font-family: Georgia, serif;
  }

  #article-extract::-webkit-scrollbar { width: 4px; }
  #article-extract::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  #article-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #wiki-link {
    color: var(--accent);
    font-size: 12px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #wiki-link:hover { color: var(--accent2); }

  #expand-btn {
    width: 100%;
    font-size: 12px;
    padding: 8px;
  }

  #legend {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(13,15,20,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 10;
    font-size: 13px;
    color: var(--muted);
    pointer-events: none;
  }

  #loading-overlay.hidden { display: none; }

  .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #hint {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
    white-space: nowrap;
    opacity: 0.6;
  }

  #conn-badge {
    display: inline-block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 10px;
    color: var(--muted);
    padding: 2px 6px;
    margin-left: 4px;
    vertical-align: middle;
  }

  .pulse {
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse {
    0%   { r: 0; opacity: 0.6; }
    100% { r: 40; opacity: 0; }
  }
</style>
</head>
<body>

<div id="toolbar">
  <h1>Wiki Explorer</h1>
  <input id="seed-input" type="text" value="Octopus" placeholder="Seed article…" />
  <label id="depth-label">Depth: <span id="depth-val">2</span></label>
  <input id="depth-slider" type="range" min="1" max="3" value="2" step="1"
    oninput="document.getElementById('depth-val').textContent=this.value">
  <label id="depth-label" style="font-size:11px;color:#e2a84a">
    ⚠ depth 3 is slow (~30–60s)
  </label>
  <button id="start-btn" onclick="startCrawl()">▶ Crawl</button>
  <button class="secondary" onclick="resetGraph()">Reset</button>
  <span id="stats"></span>
</div>

<div id="main">
  <div id="canvas-wrap">
    <svg id="graph"></svg>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <span id="loading-msg">Crawling Wikipedia…</span>
    </div>
    <div id="hint">click a node to explore · drag to reposition · scroll to zoom</div>
  </div>

  <div id="sidebar">
    <div id="sidebar-header">Article info</div>
    <div id="article-title" style="color:var(--muted);font-size:13px;padding-top:20px;text-align:center;">
      Click any node
    </div>
    <div id="article-meta"></div>
    <div id="article-extract" style="color:var(--muted);font-size:12px;padding-top:4px;font-family:inherit;">
      Select a node to see its Wikipedia summary and connection info.
    </div>
    <div id="article-footer" style="display:none">
      <a id="wiki-link" href="#" target="_blank">↗ Open in Wikipedia</a>
      <button id="expand-btn" onclick="expandSelected()">+ Expand this node</button>
    </div>
    <div id="legend">
      <div class="legend-row"><div class="legend-dot" style="background:#6c8fff"></div>Seed / expanded</div>
      <div class="legend-row"><div class="legend-dot" style="background:#a78bfa"></div>Second-level</div>
      <div class="legend-row"><div class="legend-dot" style="background:#334266"></div>Leaf (unexpanded)</div>
      <div class="legend-row"><div class="legend-dot" style="background:#f59e0b"></div>Selected</div>
    </div>
  </div>
</div>

<script>
const API     = "https://en.wikipedia.org/w/api.php";
const HEADERS = { "User-Agent": "cs108-lab/1.0 (cs108@wallawalla.edu)" };
const MAX_LINKS = 18;
const SLEEP_MS  = 120;

let nodes = [], links = [];
let nodeMap = new Map();
let selectedNode = null;
let simulation, svg, g, linkSel, nodeSel;
let crawlDepth = 2;

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function getLinks(title) {
  const params = new URLSearchParams({
    action: "query", titles: title,
    prop: "links", pllimit: MAX_LINKS,
    plnamespace: 0, format: "json", origin: "*"
  });
  const resp = await fetch(`${API}?${params}`);
  if (!resp.ok) return [];
  const data = await resp.json();
  const page = Object.values(data.query.pages)[0];
  return (page.links || []).map(l => l.title);
}

async function getExtract(title) {
  const params = new URLSearchParams({
    action: "query", titles: title,
    prop: "extracts|info", exintro: 1, exchars: 500,
    inprop: "url", format: "json", origin: "*"
  });
  const resp = await fetch(`${API}?${params}`);
  if (!resp.ok) return { extract: "", url: "" };
  const data = await resp.json();
  const page = Object.values(data.query.pages)[0];
  const raw  = page.extract || "";
  const el   = document.createElement("div");
  el.innerHTML = raw;
  return { extract: el.textContent.trim(), url: page.fullurl || "" };
}

async function crawl(seed, depth) {
  const queue = [{ title: seed, d: 0 }];
  const seen  = new Set([seed]);
  addNode(seed, 0);

  while (queue.length) {
    const { title, d } = queue.shift();
    if (d >= depth) continue;
    document.getElementById("loading-msg").textContent =
      `Crawling: ${title} (depth ${d+1}/${depth})…`;
    const linked = await getLinks(title);
    nodeMap.get(title).depth = d;
    nodeMap.get(title).expanded = true;
    for (const link of linked) {
      if (!seen.has(link)) { seen.add(link); addNode(link, d + 1); }
      addLink(title, link);
    }
    updateStats();
    updateViz();
    await sleep(SLEEP_MS);
  }
}

function addNode(title, depth) {
  if (nodeMap.has(title)) return;
  const n = { id: title, depth, expanded: false, degree: 0, url: "" };
  nodes.push(n);
  nodeMap.set(title, n);
}

function addLink(source, target) {
  const exists = links.some(l =>
    (l.source.id||l.source) === source && (l.target.id||l.target) === target
  );
  if (!exists) {
    links.push({ source, target });
    if (nodeMap.has(source)) nodeMap.get(source).degree =
      (nodeMap.get(source).degree||0) + 1;
  }
}

function nodeColor(d) {
  if (d.id === nodes[0]?.id || d.expanded) return "#6c8fff";
  if (d.depth === 1) return "#a78bfa";
  return "#334266";
}

function nodeRadius(d) {
  const base = d.id === nodes[0]?.id ? 16 :
               d.expanded ? 12 :
               d.depth === 1 ? 8 : 5;
  return base + Math.min((d.degree||0) * 0.5, 6);
}

function initSvg() {
  const el = document.getElementById("graph");
  el.innerHTML = "";
  svg = d3.select(el);

  const zoom = d3.zoom()
    .scaleExtent([0.15, 4])
    .on("zoom", e => g.attr("transform", e.transform));
  svg.call(zoom);

  g = svg.append("g");
  g.append("g").attr("class", "links-layer");
  g.append("g").attr("class", "nodes-layer");

  simulation = d3.forceSimulation()
    .force("link", d3.forceLink().id(d => d.id).distance(80).strength(0.4))
    .force("charge", d3.forceManyBody().strength(-220).distanceMax(320))
    .force("center", d3.forceCenter(
      el.clientWidth / 2, el.clientHeight / 2
    ))
    .force("collision", d3.forceCollide().radius(d => nodeRadius(d) + 6))
    .alphaDecay(0.02)
    .on("tick", ticked);
}

function linkKey(d) {
  const s = d.source?.id ?? d.source;
  const t = d.target?.id ?? d.target;
  return `${s}→${t}`;
}

function updateViz() {
  const linksLayer = g.select(".links-layer");
  const nodesLayer = g.select(".nodes-layer");

  // ── Links ──────────────────────────────────────────────────────────────────
  const linkUpdate = linksLayer.selectAll(".link").data(links, linkKey);
  linkUpdate.enter()
    .append("line")
    .attr("class", "link")
    .attr("opacity", 0)
    .transition().duration(400).attr("opacity", 1);
  linkUpdate.exit().remove();

  // ── Nodes ──────────────────────────────────────────────────────────────────
  const nodeUpdate = nodesLayer.selectAll(".node-group").data(nodes, d => d.id);

  // Enter: build group structure for new nodes only
  const nodeEnter = nodeUpdate.enter()
    .append("g")
    .attr("class", "node-group")
    .call(d3.drag()
      .on("start", dragstart)
      .on("drag",  dragged)
      .on("end",   dragend))
    .on("click", (e, d) => selectNode(d));

  nodeEnter.append("circle").attr("class", "node-circle");
  nodeEnter.append("circle").attr("class", "glow-ring")
    .attr("stroke-width", 1.5).attr("opacity", 0.3);
  nodeEnter.append("text").attr("class", "node-label");

  // Merge: apply all attribute updates to both new and existing nodes
  const merged = nodeEnter.merge(nodeUpdate);

  merged.select(".node-circle")
    .attr("r", d => nodeRadius(d))
    .attr("fill", d => selectedNode?.id === d.id ? "#f59e0b" : nodeColor(d))
    .attr("cursor", "pointer");

  merged.select(".glow-ring")
    .attr("r", d => nodeRadius(d) + 3)
    .attr("stroke", d => nodeColor(d));

  merged.select(".node-label")
    .attr("class", d => d.id === nodes[0]?.id ? "node-label seed-label" : "node-label")
    .attr("dy", d => nodeRadius(d) + 12)
    .text(d => d.id.length > 20 ? d.id.slice(0, 18) + "…" : d.id)
    .attr("opacity", d => d.depth <= 1 || d.id === nodes[0]?.id ? 1 : 0);

  nodeUpdate.exit().remove();

  simulation.nodes(nodes);
  simulation.force("link").links(links);
  simulation.alpha(0.3).restart();
}

function ticked() {
  g.select(".links-layer").selectAll(".link")
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);

  g.select(".nodes-layer").selectAll(".node-group")
    .attr("transform", d => `translate(${d.x},${d.y})`);
}

function dragstart(e, d) {
  if (!e.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragend(e, d) {
  if (!e.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

async function selectNode(d) {
  selectedNode = d;
  document.getElementById("article-title").textContent  = d.id;
  document.getElementById("article-title").style.color  = "var(--text)";
  document.getElementById("article-meta").textContent   = "Loading…";
  document.getElementById("article-extract").textContent = "";
  document.getElementById("article-footer").style.display = "flex";

  const inLinks  = links.filter(l => (l.target.id||l.target) === d.id).length;
  const outLinks = links.filter(l => (l.source.id||l.source) === d.id).length;

  const { extract, url } = await getExtract(d.id);
  document.getElementById("article-meta").innerHTML =
    `<b style="color:var(--accent)">${inLinks}</b> incoming · ` +
    `<b style="color:var(--accent2)">${outLinks}</b> outgoing · ` +
    `depth <b>${d.depth ?? "?"}</b>` +
    (d.expanded ? ` · <span style="color:#6c8fff">expanded</span>` : "");
  document.getElementById("article-extract").textContent = extract || "(No extract available)";
  document.getElementById("wiki-link").href = url || `https://en.wikipedia.org/wiki/${encodeURIComponent(d.id)}`;
  document.getElementById("expand-btn").disabled = d.expanded;
  document.getElementById("expand-btn").textContent = d.expanded ? "✓ Already expanded" : "+ Expand this node";

  d.url = url;

  highlightConnections(d);

  g.select(".nodes-layer").selectAll(".node-group").select(".node-circle")
    .attr("fill", n => selectedNode?.id === n.id ? "#f59e0b" : nodeColor(n));
}

function highlightConnections(d) {
  g.select(".links-layer").selectAll(".link")
    .classed("highlight", l =>
      (l.source.id||l.source) === d.id || (l.target.id||l.target) === d.id
    );
}

async function expandSelected() {
  if (!selectedNode || selectedNode.expanded) return;
  selectedNode.expanded = true;
  document.getElementById("expand-btn").disabled = true;
  document.getElementById("expand-btn").textContent = "Expanding…";

  const linked = await getLinks(selectedNode.id);
  selectedNode.depth = selectedNode.depth ?? 1;
  for (const link of linked) {
    if (!nodeMap.has(link)) addNode(link, selectedNode.depth + 1);
    addLink(selectedNode.id, link);
  }
  updateStats();
  updateViz();
  document.getElementById("expand-btn").textContent = "✓ Already expanded";

  g.select(".nodes-layer").selectAll(".node-group").select(".node-circle")
    .attr("fill", n => selectedNode?.id === n.id ? "#f59e0b" : nodeColor(n));
}

function updateStats() {
  document.getElementById("stats").textContent =
    `${nodes.length} nodes · ${links.length} edges`;
}

function resetGraph() {
  nodes = []; links = []; nodeMap = new Map(); selectedNode = null;
  document.getElementById("article-title").textContent = "Click any node";
  document.getElementById("article-title").style.color = "var(--muted)";
  document.getElementById("article-meta").textContent  = "";
  document.getElementById("article-extract").textContent = "Select a node to see its Wikipedia summary and connection info.";
  document.getElementById("article-footer").style.display = "none";
  document.getElementById("stats").textContent = "";
  initSvg();
  showLoading(false);
}

function showLoading(on, msg="Crawling Wikipedia…") {
  const el = document.getElementById("loading-overlay");
  el.classList.toggle("hidden", !on);
  document.getElementById("loading-msg").textContent = msg;
}

async function startCrawl() {
  const seed  = document.getElementById("seed-input").value.trim();
  crawlDepth  = parseInt(document.getElementById("depth-slider").value);
  if (!seed) return;

  resetGraph();
  showLoading(true);
  document.getElementById("start-btn").disabled = true;
  document.getElementById("hint").style.display = "none";

  try {
    await crawl(seed, crawlDepth);
  } catch(e) {
    document.getElementById("loading-msg").textContent = "Error: " + e.message;
    await sleep(2000);
  }

  showLoading(false);
  document.getElementById("start-btn").disabled = false;
  document.getElementById("hint").style.display = "block";
}

window.addEventListener("load", () => {
  initSvg();
  showLoading(false);
});
</script>
</body>
</html>
